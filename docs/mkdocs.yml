site_name: X-Ray Monolith — Документация движка
site_description: Полная документация игрового движка X-Ray Monolith (fork X-Ray 1.6.0.8, S.T.A.L.K.E.R. Anomaly)

repo_name: xray-monolith
docs_dir: docs

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: amber
    - scheme: slate
      primary: indigo
      accent: amber
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tabs
    - content.code.copy
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.caret
  - pymdownx.keys

strict: true

nav:
  - Главная: index.md
  - Начало работы:
      - Установка: getting-started/installation.md
      - Сборка: getting-started/building.md
      - Диагностика: getting-started/troubleshooting.md
  - Архитектура:
      - Обзор: architecture/overview.md
      - Карта модулей: architecture/module-map.md
      - Зависимости: architecture/dependencies.md
      - Цикл кадра: architecture/frame-loop.md
