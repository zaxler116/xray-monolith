          - Точка входа и фабрика: modules/renderer/factory.md
          - Устройство рендера: modules/renderer/render-device.md
          - Шейдерные константы: modules/renderer/constants.md
          - "Пайплайн: секторы": modules/renderer/sector.md
          - Occlusion: modules/renderer/occlusion.md
          - Динамическая сцена: modules/renderer/dsgraph.md
          - VSM / SMAP: modules/renderer/vsm-smap.md
