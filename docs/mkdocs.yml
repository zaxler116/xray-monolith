site_name: X-Ray Monolith — Документация движка
site_description: Полная документация игрового движка X-Ray Monolith (fork X-Ray 1.6.0.8, S.T.A.L.K.E.R. Anomaly)

repo_name: xray-monolith
docs_dir: docs

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: amber
    - scheme: slate
      primary: indigo
      accent: amber
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tabs
    - content.code.copy
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.caret
  - pymdownx.keys

strict: true

nav:
  - Главная: index.md
  - Начало работы:
      - Установка: getting-started/installation.md
      - Сборка: getting-started/building.md
      - Диагностика: getting-started/troubleshooting.md
  - Архитектура:
      - Обзор: architecture/overview.md
      - Карта модулей: architecture/module-map.md
      - Зависимости: architecture/dependencies.md
      - Цикл кадра: architecture/frame-loop.md
      - Модель объектов: architecture/object-model.md
      - Граница скриптинга: architecture/scripting-boundary.md
  - Модули:
      - xrCore (фундамент):
          - Обзор: modules/xr-core/index.md
          - Типы и математика: modules/xr-core/types-math.md
          - Память: modules/xr-core/memory.md
          - Строки: modules/xr-core/strings.md
          - Логирование: modules/xr-core/logging.md
          - Файловая система: modules/xr-core/filesystem.md
          - INI / конфиги: modules/xr-core/inifile.md
          - Сжатие: modules/xr-core/compression.md
          - Локализатор (архивы): modules/xr-core/locator.md
          - Временны́е/системные: modules/xr-core/system.md
      - xrEngine (ядро):
          - Обзор: modules/xr-engine/index.md
          - Ядро и API: modules/xr-engine/engine.md
          - API и события: modules/xr-engine/api.md
          - Цикл кадра: modules/xr-engine/frame-loop.md
          - Sheduler: modules/xr-engine/scheduler.md
          - Device: modules/xr-engine/device.md
          - Окно и WndProc: modules/xr-engine/device-window.md
          - Рендер-слой: modules/xr-engine/render.md
          - IRenderable: modules/xr-engine/renderable.md
          - Fmesh: modules/xr-engine/fmesh.md
          - Коллизии и физика: modules/xr-engine/collide-physics.md
          - Объект: modules/xr-engine/xr-object.md
          - Уровень: modules/xr-engine/level.md
          - Пул объектов: modules/xr-engine/object-pool.md
          - Persistent: modules/xr-engine/persistent.md
          - Скелет и анимация: modules/xr-engine/skeleton-motion.md
          - Окружение: modules/xr-engine/environment.md
          - Эффекторы: modules/xr-engine/effector.md
          - Feels: modules/xr-engine/feel.md
          - Визуальные эффекты: modules/xr-engine/effects.md
          - Камера: modules/xr-engine/camera.md
          - HUD: modules/xr-engine/hud.md
          - UI-примитивы: modules/xr-engine/ui-primitives.md
          - Ввод: modules/xr-engine/input.md
          - Консоль: modules/xr-engine/console.md
          - Lua-биндинг: modules/xr-engine/lua-binding.md
